name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build_ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          cache: true
      - name: Install Flutter dependencies
        working-directory: budget
        run: flutter pub get
      - name: Build unsigned iOS release
        working-directory: budget
        run: flutter build ios --release --no-codesign
      - name: Package Cashew.ipa
        working-directory: budget
        run: |
          rm -rf build/ios/ipa Payload
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/Runner.app
          zip -qry Cashew.ipa Payload
      - name: Upload Cashew.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Cashew-ios-unsigned
          path: budget/Cashew.ipa
          retention-days: 14
